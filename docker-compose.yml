# Self-hostable stack: postgres + migrations + api + worker + dashboard
# (PROJECT.md §41-§44). See docs/deployment.md for a Linux server walkthrough.
#
# The collector runs in its own `worker` container rather than inside the API so
# that restarting or scaling the API never duplicates or drops a collection.
#
# Published ports bind to BIND_ADDRESS (default 127.0.0.1). Docker bypasses host
# firewalls such as ufw, and neither the API nor the dashboard has
# authentication, so reach them through an SSH tunnel or a VPN (Tailscale)
# rather than exposing them publicly.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: btc-trader:local
  env_file: [.env]
  environment:
    # Inside the compose network the database always has this address; the value
    # in .env may point somewhere else for local (non-Docker) runs.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-btc}:${POSTGRES_PASSWORD:-btc}@db:5432/${POSTGRES_DB:-btc_trader}
    API_BASE_URL: http://api:8000
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16.6-alpine
    container_name: btc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btc}
      POSTGRES_DB: ${POSTGRES_DB:-btc_trader}
      # Deterministic collation keeps index behaviour identical across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      # Named volume: restarting or recreating containers must not erase
      # historical market data (§42).
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host access only, for backups or local tools; never the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btc} -d ${POSTGRES_DB:-btc_trader}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # Runs once per `up`, brings the schema to head, then exits 0.  Everything
  # else waits for it, so no service ever queries a half-migrated database.
  migrate:
    image: btc-trader:local
    container_name: btc-migrate
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-btc}:${POSTGRES_PASSWORD:-btc}@db:5432/${POSTGRES_DB:-btc_trader}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    <<: *app
    build:
      context: .
      target: runtime
    container_name: btc-api
    command:
      - uvicorn
      - btc_trader.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-btc}:${POSTGRES_PASSWORD:-btc}@db:5432/${POSTGRES_DB:-btc_trader}
      API_BASE_URL: http://api:8000
      # The worker owns the schedule; two schedulers would double every fetch.
      RUN_SCHEDULER_IN_API: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      # A degraded exchange still answers 200 — only a database failure fails
      # the check, so a bitFlyer hiccup cannot restart-loop the API (§43).
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    container_name: btc-worker
    command: ["python", "-m", "btc_trader.worker"]
    healthcheck:
      # No HTTP surface: prove the process can still reach the database and that
      # the collector is not stalled.
      test: ["CMD", "python", "-m", "btc_trader.scripts.healthcheck", "--no-exchange"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  dashboard:
    <<: *app
    container_name: btc-dashboard
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: btc_trader_postgres_data
