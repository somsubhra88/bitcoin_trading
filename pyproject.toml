[project]
name = "btc-trader"
version = "0.1.0"
description = "Modular, self-hostable BTC/JPY market-data and (future) algorithmic trading platform for bitFlyer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.36",
    # The [asyncio] extra pulls in greenlet, without which the async engine
    # raises at the first query ("the greenlet library is required").
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "aiosqlite>=0.20,<0.22",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "apscheduler>=3.11,<4.0",
    "httpx>=0.28,<0.29",
    "structlog>=24.4,<26.0",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
    "pandas>=2.2,<3.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.2",
    "respx>=0.22,<0.23",
    "ruff>=0.8,<0.15",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_trader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "ASYNC",         # async gotchas
    "BLE",           # blind excepts must be justified
    "S",             # security (bandit)
    "RUF",
]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
# ``dashboard`` is a top-level module in this repo, not a third-party package.
known-first-party = ["btc_trader", "dashboard", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, and fixtures use throwaway credentials.
"tests/**" = ["E501", "S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["btc_trader"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "plotly.*", "streamlit.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." makes `tests.fixtures.*` importable from any test module.
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: tests that contact the real bitFlyer public API (deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning:apscheduler.*"]
